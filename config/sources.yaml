sources:
  rss:
    - url: "https://weworkremotely.com/remote-jobs/search?term=python+vue&format=rss"
      label: "WWR: python+vue"
    - url: "https://weworkremotely.com/categories/remote-full-stack-programming-jobs.rss"
      label: "WWR: full-stack"
    - url: "https://remotive.com/remote-jobs/software-dev/feed"
      label: "Remotive: software-dev"
    - url: "https://remotive.com/remote-jobs/software-dev?search=vue+python&format=rss"
      label: "Remotive: vue+python"

  browser:
    - platform: weworkremotely
      url: "https://weworkremotely.com/remote-jobs/search?term=python+vue"
      label: "WWR browser: python+vue"
    - platform: wellfound
      url: "https://wellfound.com/jobs?role=fullstack&remote=true"
      label: "Wellfound: fullstack remote"
    - platform: indeed
      url: "https://www.indeed.com/jobs?q=python+developer&l=Europe&fromage=14"
      label: "Indeed: python Europe 14d"

  linkedin:
    - url: "https://www.linkedin.com/jobs/search/?keywords=full+stack+python+vue+visa+sponsorship&location=Europe&f_WT=2"
      label: "LinkedIn: fullstack+visa+Europe"
    - url: "https://www.linkedin.com/jobs/search/?keywords=python+fastapi+remote+relocation&location=Worldwide&f_WT=2"
      label: "LinkedIn: python+fastapi+remote"

scoring:
  weights:
    visa_signal: 0.40
    skill_match: 0.35
    target_region: 0.15
  skill_signals:
    - Vue.js
    - Python
    - FastAPI
    - TypeScript
    - Docker
    - PostgreSQL
    - React
    - Node.js
    - Django
  visa_signals:
    - "visa sponsorship"
    - "work permit"
    - "relocation"
    - "eu blue card"
    - "open to relocation"
    - "remote worldwide"
    - "global team"
    - "distributed team"
    - "international candidates"
    - "we sponsor"
    - "willing to sponsor"
    - "remote-first"
    - "anywhere in the world"
  skip_signals:
    - "on-site only"
    - "internship"
    - "must be local"
    - "no relocation"
    - "staffing agency"
    - "fluent german required"
    - "native speaker required"
    - "0-1 years"
    - "0-2 years"

circuit_breakers:
  failure_threshold: 5
  cooldowns:
    linkedin: 8
    wellfound: 4
    weworkremotely: 2
    adzuna: 1
    rss: 1
    default: 4

budgets:
  gemini_calls: 50
  adzuna_calls: 500
  serp_api: 100
  brave_api: 150
  playwright_sessions: 200
  smtp_handshakes: 50
  httpx_requests: 2000
  ddg_queries: 200

